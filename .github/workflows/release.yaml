name: release

on:
  repository_dispatch:
    types: [ trigger-release ]
  workflow_dispatch:
    inputs:
      stableVersion:
        description: "Stable release version (e.g., 1.8.0)"
        required: true
      betaVersion:
        description: "Beta release version (e.g., 1.8.0-beta15)"
        required: true
      branch:
        description: "Branch to release from (e.g., 'main' for minor releases, 'release/x.y.z' for patch releases)"
        required: false
        default: "main"
      startFrom:
        description: "Phase to start from (use to resume after a failed release)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - commit-and-tag

env:
  STABLE_VERSION: ${{ github.event.inputs.stableVersion || github.event.client_payload.stableVersion }}
  BETA_VERSION: ${{ github.event.inputs.betaVersion || github.event.client_payload.betaVersion }}
  BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'main' }}
  START_FROM: ${{ github.event.inputs.startFrom || github.event.client_payload.startFrom || 'release' }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_AUTOMATION }}

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Show inputs
        run: |
          echo "Stable version: $STABLE_VERSION"
          echo "Beta version: $BETA_VERSION"
          echo "Branch to release from: $BRANCH"
          echo "Start from phase: $START_FROM"

      # Guards against releasing from the wrong branch, which is how 1.19.1-beta29 was cut from main
      # on top of 1.20.0-beta30. The version being released must be newer than every release
      # already reachable from the chosen branch. Compared on the beta version, since that is what
      # this repo tags.
      - name: Verify the version is newer than the branch's latest release
        run: |
          LATEST=$(git tag --merged HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No release tags reachable from $BRANCH; nothing to compare against."
            exit 0
          fi
          NEWEST=$(printf '%s\n%s\n' "$LATEST" "$BETA_VERSION" | sort -V | tail -1)
          if [ "$BETA_VERSION" = "$LATEST" ] || [ "$NEWEST" != "$BETA_VERSION" ]; then
            echo "::error::Refusing to release $BETA_VERSION from $BRANCH: $LATEST is already released and reachable from this branch. A patch must be cut from its release/x.y.x branch, not from a branch that has moved past it."
            exit 1
          fi
          echo "OK: $BETA_VERSION is newer than $LATEST, the latest release reachable from $BRANCH."

      - name: Compute start phase number
        id: phase
        run: |
          case "$START_FROM" in
            release)        echo "num=1" >> "$GITHUB_OUTPUT" ;;
            commit-and-tag) echo "num=2" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown startFrom: $START_FROM" >&2; exit 1 ;;
          esac

      - name: Extract current stable SNAPSHOT version from POM property
        id: extract-stable-snapshot-version
        run: |
          REVISION=$(mvn help:evaluate -Dexpression=langchain4j.stable.version -q -DforceStdout)
          echo "stableVersionSnapshot=$REVISION" >> $GITHUB_OUTPUT

      - name: Update stable versions
        run: mvn versions:set -DnewVersion="$STABLE_VERSION" -DoldVersion=${{ steps.extract-stable-snapshot-version.outputs.stableVersionSnapshot }} -DgroupId=* -DartifactId=* -DgenerateBackupPoms=false

      - name: Update stable version property
        run: mvn versions:set-property -Dproperty=langchain4j.stable.version -DnewVersion="$STABLE_VERSION" -DgenerateBackupPoms=false

      - name: Extract current beta SNAPSHOT version from POM property
        id: extract-beta-snapshot-version
        run: |
          REVISION=$(mvn help:evaluate -Dexpression=langchain4j.beta.version -q -DforceStdout)
          echo "betaVersionSnapshot=$REVISION" >> $GITHUB_OUTPUT

      - name: Update beta versions
        run: mvn versions:set -DnewVersion="$BETA_VERSION" -DoldVersion=${{ steps.extract-beta-snapshot-version.outputs.betaVersionSnapshot }} -DgroupId=* -DartifactId=* -DgenerateBackupPoms=false

      - name: Update beta version property
        run: mvn versions:set-property -Dproperty=langchain4j.beta.version -DnewVersion="$BETA_VERSION" -DgenerateBackupPoms=false

      - name: Release
        if: ${{ fromJSON(steps.phase.outputs.num) <= 1 }}
        run: mvn -B -U --fail-at-end -DskipTests -DskipITs -Psign clean deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Commit version changes
        if: ${{ fromJSON(steps.phase.outputs.num) <= 2 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml '**/pom.xml'
          git commit -m "Release versions $STABLE_VERSION and $BETA_VERSION"

      - name: Push
        if: ${{ fromJSON(steps.phase.outputs.num) <= 2 }}
        run: |
          git push origin "$BRANCH"

      - name: Tag release
        if: ${{ fromJSON(steps.phase.outputs.num) <= 2 }}
        run: |
          git tag "$BETA_VERSION"
          git push origin "$BETA_VERSION"

      # A minor release is the point where its maintenance line starts, so create the branch now
      # rather than scrambling for one when a patch is needed.
      - name: Create the maintenance branch for a minor release
        if: ${{ fromJSON(steps.phase.outputs.num) <= 2 }}
        run: |
          case "$STABLE_VERSION" in
            *.0)
              MAINTENANCE_BRANCH="release/${STABLE_VERSION%.*}.x"
              if git ls-remote --exit-code --heads origin "$MAINTENANCE_BRANCH" >/dev/null 2>&1; then
                echo "$MAINTENANCE_BRANCH already exists."
              else
                git branch "$MAINTENANCE_BRANCH" HEAD
                git push origin "$MAINTENANCE_BRANCH"
                echo "Created $MAINTENANCE_BRANCH."
              fi
              ;;
            *)
              echo "$STABLE_VERSION is a patch release; its maintenance branch already exists."
              ;;
          esac
