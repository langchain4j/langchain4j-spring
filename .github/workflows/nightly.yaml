name: Nightly integration tests

# The tests that talk to a real provider API live here rather than in the PR build. Everything they used to
# cover about the starters themselves is covered by the mock-based unit tests, which run on every PR; what is
# left is the handful of cases a stub server cannot reach - see the Javadoc on each remaining *IT class.
#
# The PR build (main.yaml) deliberately does not set these secrets, so the same tests skip there. Keeping the
# secrets in one place means a pull request from a fork behaves exactly like a build of main.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  integration_tests:
    # do not run in forks, which have none of the secrets below
    if: github.repository == 'langchain4j/langchain4j-spring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run integration tests
        id: build
        run: |
          set -o pipefail
          mvn -U -B --fail-at-end clean install 2>&1 | tee maven-output.log
        env:
          LC4J_GLOBAL_TEST_RETRY_ENABLED: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY: ${{ secrets.AZURE_SEARCH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_GEMINI_API_KEY: ${{ secrets.GOOGLE_AI_GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # No secrets exist for the environment variables below, so the integration tests guarded by them do
          # not run anywhere - not here and not in the PR build. Add the secrets to switch these tests on:
          #   AZURE_COSMOS_MONGO_VCORE_CONNECTION_STRING  langchain4j-azure-cosmos-mongo-vcore-spring-boot*-starter
          #   AZURE_COSMOS_NOSQL_ENDPOINT                 langchain4j-azure-cosmos-nosql-spring-boot*-starter
          #   GCP_PROJECT_ID / GCP_LOCATION               langchain4j-vertex-ai-gemini-spring-boot*-starter
          #   MICROSOFT_FOUNDRY_API_KEY / _ENDPOINT       langchain4j-open-ai-official-spring-boot*-starter
          #   AZURE_SEARCH_RERANKER_AVAILABLE             langchain4j-azure-ai-search-spring-boot*-starter (one test)

      - name: Surface build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo '## Build Errors (Nightly)'
            echo ''
            echo '```'
            # Exclude forked-JVM output re-emitted with an [ERROR] prefix (test noise).
            grep '^\[ERROR\]' maven-output.log \
              | grep -vE '^\[ERROR\]( +"|[[:space:]]*(Stub|DEBUG:)|[[:space:]]*$)' \
              | head -50
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Clean Docker
        if: always()
        run: docker system prune -af || true

      - name: Publish Test Summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import glob, os, re

          files = glob.glob('**/target/*-reports/TEST-*.xml', recursive=True)
          total = failures = errors = skipped = 0
          failed_tests = []

          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  total += int(root.get('tests', 0))
                  failures += int(root.get('failures', 0))
                  errors += int(root.get('errors', 0))
                  skipped += int(root.get('skipped', 0))
                  for tc in root.findall('.//testcase'):
                      fail = tc.find('failure')
                      if fail is None:
                          fail = tc.find('error')
                      if fail is not None:
                          cls = tc.get('classname', '')
                          name = tc.get('name', '')
                          trace = fail.text or ''
                          m = re.search(r'\bat ' + re.escape(cls) + r'[.$][^\n(]*\(([^)]+\.java:\d+)\)', trace)
                          loc = f'`{m.group(1)}`' if m else ''
                          msg = (fail.get('message', '') or '').replace('\n', '<br>').replace('|', '\\|')
                          if len(msg) > 500:
                              msg = f"{msg[:500]}<details><summary>show more</summary>{msg[500:]}</details>"
                          failed_tests.append(f"| `{cls}` | `{name}` | {loc} | {msg} |")
              except Exception:
                  pass

          passed = total - failures - errors - skipped
          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary, 'a') as f:
              f.write('## Test Results\n\n')
              if failures == 0 and errors == 0:
                  f.write(f':white_check_mark: **{passed} passed**, {skipped} skipped out of {total} tests\n')
              else:
                  f.write(f':x: **{failures} failed, {errors} errors**, {passed} passed, {skipped} skipped out of {total} tests\n')
              if failed_tests:
                  f.write('\n### Failures\n\n')
                  f.write('| Class | Test | Location | Error Message |\n')
                  f.write('|-------|------|----------|---------------|\n')
                  for line in failed_tests[:50]:
                      f.write(line + '\n')
                  if len(failed_tests) > 50:
                      f.write(f'\n*... and {len(failed_tests) - 50} more*\n')
          PYEOF

      - name: Upload Test Reports
        if: always() # always run even if the previous step failed or was cancelled
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Test-Reports
          path: '**/target/*-reports/*'
