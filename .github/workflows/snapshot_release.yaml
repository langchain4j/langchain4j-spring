name: snapshot_release

on:
  repository_dispatch:
    types: [ trigger-snapshot-release ]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-release
  cancel-in-progress: false

jobs:
  snapshot_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      # Every push to main runs this, including the "Release versions x.y.z" commits, where the
      # version is not a SNAPSHOT. Deploying those re-publishes a release: it normally fails on
      # "already exists", but would push an unsigned release if a release ever died before deploying.
      - name: Check the version is a SNAPSHOT
        id: snapshot-check
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "Version is $VERSION."
              ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Version is $VERSION, not a SNAPSHOT; skipping the snapshot deploy. If main is meant to be in development, run 'Update versions for next dev iteration'."
              ;;
          esac

      # A version bump pushes to main here and in the core repo moments apart, so this
      # push-triggered run can start before the core repo has published the SNAPSHOT it depends on
      # (that is the "Non-resolvable import POM: langchain4j-bom" failure). The core repo dispatches
      # trigger-snapshot-release once its own snapshot is published, so skip rather than fail:
      # that dispatch runs this again with the dependency in place.
      - name: Check the core SNAPSHOT this build depends on is published
        id: core-check
        if: steps.snapshot-check.outputs.proceed == 'true'
        run: |
          CORE_VERSION=$(mvn help:evaluate -Dexpression=langchain4j.stable.version -q -DforceStdout)
          case "$CORE_VERSION" in
            *-SNAPSHOT)
              if mvn -B -U -q dependency:get -Dartifact="dev.langchain4j:langchain4j-bom:$CORE_VERSION:pom" >/dev/null 2>&1; then
                echo "proceed=true" >> "$GITHUB_OUTPUT"
                echo "langchain4j-bom $CORE_VERSION is available."
              else
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "::warning::langchain4j-bom $CORE_VERSION is not published yet; skipping the snapshot deploy. The core repo triggers this workflow again once its own snapshot is published."
              fi
              ;;
            *)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "Core version $CORE_VERSION is a release, nothing to wait for."
              ;;
          esac

      - name: snapshot_release
        if: steps.snapshot-check.outputs.proceed == 'true' && steps.core-check.outputs.proceed == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: mvn -B -U --fail-at-end -DskipTests -DskipITs clean deploy
