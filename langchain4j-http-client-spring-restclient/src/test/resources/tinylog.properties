# Write log entries on tinylog's writer thread instead of the calling thread, so that the BlockHound test
# (SpringRestClientReactorPublisherNonBlockingIT) does not flag synchronous console writes on the transport threads.
writingthread = true

# Make LoggingHttpClient log every streamed event, so that the logging=true case of that test exercises the logging path.
level@dev.langchain4j.http.client.log = debug
